[package]
name = "piecemaker-hudsucker"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
hudsucker = { version = "0.25", default-features = false, features = ["decoder", "http2", "rcgen-ca", "rustls-client"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
