<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi partagé</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6b675f; --line: #e4e0d8; --accent: #8a4b2a; --card: #ffffff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #171614; --fg: #ece9e3; --muted: #a29d93; --line: #2e2c28; --accent: #e09a6f; --card: #1f1e1b; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #171614; --fg: #ece9e3; --muted: #a29d93; --line: #2e2c28; --accent: #e09a6f; --card: #1f1e1b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 28px 16px 64px; }
h1 { font-size: 1.4rem; margin: 0 0 16px; }
form { display: flex; gap: 8px; margin-bottom: 16px; }
input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--card); font: inherit; cursor: pointer; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
li.done span { text-decoration: line-through; color: var(--muted); }
.empty, .note { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Suivi partagé</h1>
  <form id="add"><input type="text" id="text" placeholder="Nouvel élément" aria-label="Nouvel élément" required><button>Ajouter</button></form>
  <ul id="items"></ul>
  <p class="note" id="note"></p>
</main>
<script>
const db = window.artifact?.db;
const list = document.getElementById('items');
const note = document.getElementById('note');
async function refresh() {
  if (!db) { note.textContent = 'Base indisponible : ouvrez cet artifact dans l’onglet Artifacts.'; return; }
  const { documents } = await db.query('items', { order_by: { field: 'order' } });
  list.replaceChildren(...documents.map((doc) => {
    const item = document.createElement('li');
    item.className = doc.data.done ? 'done' : '';
    const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: Boolean(doc.data.done) });
    box.addEventListener('change', async () => { await db.update('items', doc.id, { done: box.checked }, { ifVersion: doc.version }); refresh(); });
    const label = document.createElement('span');
    label.textContent = doc.data.text + (doc.data.due ? ` · ${doc.data.due}` : '');
    item.append(box, label);
    return item;
  }));
  if (!documents.length) list.innerHTML = '<li class="empty">Rien à suivre pour l’instant.</li>';
}
document.getElementById('add').addEventListener('submit', async (event) => {
  event.preventDefault();
  const input = document.getElementById('text');
  await db.set('items', `i${Date.now().toString(36)}`, { text: input.value.trim(), done: false, order: Date.now() });
  input.value = '';
  refresh();
});
window.addEventListener('artifact:data', refresh);
refresh().catch((error) => { note.textContent = error.message; });
</script>
</body>
</html>
