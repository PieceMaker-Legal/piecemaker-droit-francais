<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouvelle page</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6b675f; --line: #e4e0d8; --accent: #8a4b2a; --card: #ffffff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #171614; --fg: #ece9e3; --muted: #a29d93; --line: #2e2c28; --accent: #e09a6f; --card: #1f1e1b; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #171614; --fg: #ece9e3; --muted: #a29d93; --line: #2e2c28; --accent: #e09a6f; --card: #1f1e1b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Nouvelle page</h1>
  <p class="lead">Une phrase qui dit ce que la page montre.</p>
  <section class="card">
    <p>Contenu.</p>
  </section>
</main>
</body>
</html>
