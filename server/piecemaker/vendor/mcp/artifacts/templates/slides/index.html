<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Présentation</title>
<style>
:root { --bg: #f4f2ee; --fg: #1b1a18; --muted: #6d695f; --slide: #ffffff; --accent: #8a4b2a; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f0f0e; --fg: #eeebe5; --muted: #a39e93; --slide: #1c1b19; --accent: #e09a6f; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0f0f0e; --fg: #eeebe5; --muted: #a39e93; --slide: #1c1b19; --accent: #e09a6f; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.5 ui-sans-serif, system-ui, sans-serif; height: 100vh; display: grid; place-items: center; overflow: hidden; }
.slide { display: none; width: min(100vw - 32px, (100vh - 64px) * 16 / 9); aspect-ratio: 16 / 9; background: var(--slide); border-radius: 12px; padding: 5% 6%; box-shadow: 0 2px 20px rgb(0 0 0 / .08); flex-direction: column; justify-content: center; }
.slide.active { display: flex; }
.slide h1 { font-size: clamp(1.4rem, 4vw, 2.6rem); margin: 0 0 .4em; }
.slide h2 { font-size: clamp(1.1rem, 3vw, 1.9rem); margin: 0 0 .6em; color: var(--accent); }
.slide p, .slide li { font-size: clamp(.9rem, 2vw, 1.3rem); }
.counter { position: fixed; bottom: 12px; right: 16px; color: var(--muted); font-size: 13px; }
@media print { body { display: block; height: auto; overflow: visible; background: #fff; } .slide { display: flex !important; width: 100%; page-break-after: always; box-shadow: none; } .counter { display: none; } @page { size: 297mm 167mm; margin: 0; } }
</style>
</head>
<body>
<section class="slide active"><h1>Titre de la présentation</h1><p>Dossier · date</p></section>
<section class="slide"><h2>Une conclusion par diapositive</h2><ul><li>Premier point</li><li>Deuxième point</li></ul></section>
<section class="slide"><h2>Décision attendue</h2><p>…</p></section>
<div class="counter" aria-live="polite"></div>
<script>
const slides = [...document.querySelectorAll('.slide')];
let index = 0;
const show = (next) => { index = Math.max(0, Math.min(slides.length - 1, next)); slides.forEach((slide, i) => slide.classList.toggle('active', i === index)); document.querySelector('.counter').textContent = `${index + 1} / ${slides.length}`; };
document.addEventListener('keydown', (event) => { if (['ArrowRight', 'PageDown', ' '].includes(event.key)) show(index + 1); if (['ArrowLeft', 'PageUp'].includes(event.key)) show(index - 1); });
document.addEventListener('click', (event) => show(index + (event.clientX > innerWidth / 2 ? 1 : -1)));
show(0);
</script>
</body>
</html>
