name: PieceMaker Mistral SDK Windows Trial

on:
  workflow_dispatch:
  push:
    branches: [MAJ-continue]
    paths:
      - '.github/workflows/piecemaker-mistral-sdk-windows.yml'
      - 'scripts/piecemaker/mistral-sdk/**'

permissions:
  contents: read

jobs:
  windows-sdk-trial:
    if: github.ref == 'refs/heads/MAJ-continue'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.2
      - name: Package and test the standalone Windows SDK trial
        shell: pwsh
        env:
          PIECEMAKER_SDK_OUTPUT: ${{ runner.temp }}/Mistral-SDK-Windows-x64
        run: node scripts/piecemaker/mistral-sdk/build-windows.mjs
      - name: Upload the standalone trial without publishing a release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Mistral-SDK-Windows-x64
          path: ${{ runner.temp }}/Mistral-SDK-Windows-x64
          if-no-files-found: error
          retention-days: 14
