name: PieceMaker Hudsucker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the prebuilt anonymisation proxy to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build piecemaker-hudsucker (win32-x64)
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Build
        run: cargo build --release --manifest-path server/piecemaker/anonymizer/hudsucker-proxy/Cargo.toml

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Build better-sqlite3 for Electron
        shell: bash
        run: |
          SQLITE_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/better-sqlite3'].version")"
          ELECTRON_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          mkdir -p "$RUNNER_TEMP/sqlite" && cd "$RUNNER_TEMP/sqlite"
          npm init -y >/dev/null
          npm install "better-sqlite3@$SQLITE_VERSION" --ignore-scripts --no-audit --no-fund
          cd node_modules/better-sqlite3
          npx --yes node-gyp@11 rebuild --release --arch=x64 --target="$ELECTRON_VERSION" --dist-url=https://electronjs.org/headers

      - name: Stage assets
        shell: bash
        run: |
          mkdir -p dist
          cp server/piecemaker/anonymizer/hudsucker-proxy/target/release/piecemaker-hudsucker.exe dist/piecemaker-hudsucker-win32-x64.exe
          cp "$RUNNER_TEMP/sqlite/node_modules/better-sqlite3/build/Release/better_sqlite3.node" dist/better-sqlite3-electron-win32-x64.node
          cd dist
          for asset in piecemaker-hudsucker-win32-x64.exe better-sqlite3-electron-win32-x64.node; do
            sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
          done

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
