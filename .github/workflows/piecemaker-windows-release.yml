name: PieceMaker Windows Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      finalize:
        description: "Publish the GitHub release after assets are attached"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the prebuilt Windows assets to"
        required: true
        type: string
      finalize:
        description: "Publish the GitHub release after assets are attached"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows assets (win32-x64)
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Test Windows startup
        run: node --experimental-vm-modules --test desktop-bootstrap/overlay/electron-piecemaker/main.test.js

      - name: Test desktop dependency selection
        run: |
          $env:PSModulePath = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\Modules'
          node --test desktop-bootstrap/lib/compact-package.test.mjs desktop-bootstrap/lib/runtime-dependencies.test.mjs desktop-bootstrap/lib/missing-dependencies.test.mjs desktop-bootstrap/lib/initial-install.test.mjs desktop-bootstrap/composants/install.test.mjs

      - name: Build
        run: cargo build --release --manifest-path server/piecemaker/anonymizer/hudsucker-proxy/Cargo.toml

      - name: Build better-sqlite3 for Electron
        shell: bash
        run: |
          ELECTRON_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          {
            npm ci --ignore-scripts --no-audit --no-fund &&
            npx electron-rebuild --version "$ELECTRON_VERSION" --arch x64 --only better-sqlite3 --force
          } > "$RUNNER_TEMP/sqlite.log" 2>&1 || {
            cat "$RUNNER_TEMP/sqlite.log"
            echo "::error::$(tail -c 3500 "$RUNNER_TEMP/sqlite.log" | tr '\r\n' '  ')"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/sqlite/node_modules/better-sqlite3/build/Release"
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node "$RUNNER_TEMP/sqlite/node_modules/better-sqlite3/build/Release/"

      - name: Stage assets
        shell: bash
        run: |
          mkdir -p dist
          cp server/piecemaker/anonymizer/hudsucker-proxy/target/release/piecemaker-hudsucker.exe dist/piecemaker-hudsucker-win32-x64.exe
          cp "$RUNNER_TEMP/sqlite/node_modules/better-sqlite3/build/Release/better_sqlite3.node" dist/better-sqlite3-electron-win32-x64.node
          cd dist
          for asset in piecemaker-hudsucker-win32-x64.exe better-sqlite3-electron-win32-x64.node; do
            sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
          done
          mkdir -p "$RUNNER_TEMP/native-assets"
          cp * "$RUNNER_TEMP/native-assets/"

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Prebuild portable Python components
        shell: bash
        env:
          PIECEMAKER_REPO: ${{ github.repository }}
          PIECEMAKER_TAG: ${{ env.TAG }}
        run: |
          export PATH="$(cygpath -u "$(node -p process.env.SystemRoot)")/System32:$PATH"
          node desktop-bootstrap/composants/build-release.mjs "$(cygpath -w "$RUNNER_TEMP/native-assets")" > "$RUNNER_TEMP/python.log" 2>&1 || {
            tail -c 12000 "$RUNNER_TEMP/python.log"
            exit 1
          }
          tail -n 5 "$RUNNER_TEMP/python.log"

      - name: Require Windows publisher certificate
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD are required to Authenticode-sign the installer."
            exit 1
          fi

      - name: Build desktop app
        shell: bash
        env:
          CI: "true"
          PIECEMAKER_NO_PROGRESS: "1"
          PIECEMAKER_HOME: ${{ runner.temp }}/piecemaker-home
          PIECEMAKER_REPO: ${{ github.repository }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          git clean -ffdxq
          if [ "$TAG" = "v2.0.38" ]; then
            node --input-type=module -e 'import fs from "node:fs"; const file = "package.json"; const manifest = JSON.parse(fs.readFileSync(file, "utf8")); const icon = "server/piecemaker/vendor/installer/assets/piecemaker.ico"; manifest.build.nsis.installerIcon = icon; manifest.build.nsis.uninstallerIcon = icon; fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");'
          fi
          export PIECEMAKER_SRC_DIR="$(cygpath -w "$GITHUB_WORKSPACE")" PIECEMAKER_TAG="$TAG"
          export PIECEMAKER_PREBUILT_ASSET_DIR="$(cygpath -w "$RUNNER_TEMP/native-assets")"
          node desktop-bootstrap/lib/build-release.mjs "$(cygpath -w "$RUNNER_TEMP/app/piecemaker-desktop-win32-x64.tar.gz")" > "$RUNNER_TEMP/app.log" 2>&1 || {
            tail -c 20000 "$RUNNER_TEMP/app.log"
            echo "::error::$(tail -c 3500 "$RUNNER_TEMP/app.log" | tr '\r\n' '  ')"
            exit 1
          }
          tail -n 20 "$RUNNER_TEMP/app.log"
          node desktop-bootstrap/lib/verify-packaged-runtime.mjs release/desktop/win-unpacked release/desktop
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '
            $exe = Get-ChildItem -Path release/desktop -Filter *-win-x64.exe | Select-Object -First 1
            if (-not $exe) { throw "Installer exe missing" }
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            if (-not $sig.SignerCertificate -or $sig.Status -eq "NotSigned") {
              throw "Installer is not Authenticode-signed: $($sig.Status)"
            }
            Write-Host "Signed by $($sig.SignerCertificate.Subject) status $($sig.Status)"
          '
          cp release/desktop/*.exe release/desktop/*.blockmap release/desktop/latest.yml release/desktop/piecemaker-runtime-components-*.tar.gz "$RUNNER_TEMP/app/"
          cp "$RUNNER_TEMP/native-assets"/piecemaker-python-* "$RUNNER_TEMP/native-assets/python-runtime.json" "$RUNNER_TEMP/app/"
          cd "$RUNNER_TEMP/app"
          for installer in *.exe; do
            sha256sum "$installer" | cut -d' ' -f1 > "$installer.sha256"
          done
          for component in piecemaker-runtime-components-*.tar.gz; do
            sha256sum "$component" | cut -d' ' -f1 > "$component.sha256"
          done
          sha256sum piecemaker-desktop-win32-x64.tar.gz | cut -d' ' -f1 > piecemaker-desktop-win32-x64.tar.gz.sha256
          ls -la

      - name: Attach desktop app to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/app/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify release assets
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/app/latest.yml"
          test -f "$RUNNER_TEMP/app/piecemaker-python-win32-x64.tar.gz.sha256"
          test -f "$RUNNER_TEMP/app/python-runtime.json"
          test -n "$(find "$RUNNER_TEMP/app" -name '*.exe.sha256' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/app" -name '*.blockmap' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/app" -name 'piecemaker-runtime-components-*.tar.gz' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/app" -name 'piecemaker-runtime-components-*.tar.gz.sha256' -print -quit)"

      - name: Publish the complete release
        if: ${{ inputs.finalize == true || inputs.finalize == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
