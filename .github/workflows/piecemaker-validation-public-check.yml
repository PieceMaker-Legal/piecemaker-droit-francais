name: PieceMaker Published Installer Check

on:
  workflow_dispatch:
  push:
    branches: [MAJ-continue]
    paths: ['.github/workflows/piecemaker-validation-public-check.yml']

permissions:
  contents: write

jobs:
  verify-public-executable:
    if: github.ref == 'refs/heads/MAJ-continue'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: PieceMaker-Legal/piecemaker-droit-francais
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Download and verify the exact published installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-installer"
          gh release download validation-installation-desktop-2.0.47 --pattern '*.exe' --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/public-installer"
          cd "$RUNNER_TEMP/public-installer"
          sha256sum -c SHA256SUMS.txt
          test "$(cut -d ' ' -f 1 SHA256SUMS.txt)" = '699c692e17fa9fb0f674229e8993db52377fe21bb947d6cd577a7aa8370f086c'
      - name: Install the actual delivered application
        shell: pwsh
        run: |
          $destination=Join-Path $env:RUNNER_TEMP 'public-installed'
          $installer=Join-Path $env:RUNNER_TEMP 'public-installer/PieceMaker-Validation-2.0.47-win-x64.exe'
          $process=Start-Process -FilePath $installer -ArgumentList @('/S',"/D=$destination") -Wait -PassThru
          if($process.ExitCode -ne 0){throw 'Installation failed'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PIECEMAKER_TEST_INSTALLED=$destination"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PIECEMAKER_TEST_OUTPUT=$env:RUNNER_TEMP/public-verification"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PIECEMAKER_HOME=$env:RUNNER_TEMP/comparison-components"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/public-verification" | Out-Null
      - name: Generate an independent certificate for the comparison only
        shell: bash
        run: node --input-type=module -e 'const {generateCertificates}=await import("./desktop-bootstrap/lib/certificates.mjs");await generateCertificates();'
      - name: Wait for the usable authenticated interface and verify restart
        shell: bash
        run: node scripts/piecemaker/ui-updates/windows-validation/verify-installed.mjs "$PIECEMAKER_TEST_INSTALLED/PieceMakerValidation.exe"
      - name: Attach the complete UI verification without changing the executable
        shell: bash
        run: |
          set -euo pipefail
          gh release upload validation-installation-desktop-2.0.47 "$PIECEMAKER_TEST_OUTPUT/installation-verification.json" "$PIECEMAKER_TEST_OUTPUT/01-installed.png" "$PIECEMAKER_TEST_OUTPUT/02-restarted.png" --clobber
