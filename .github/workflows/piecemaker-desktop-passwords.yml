name: PieceMaker desktop passwords

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop-bootstrap/overlay/electron-piecemaker/auth/**'
      - 'desktop-bootstrap/overlay/electron-piecemaker/main.js'
      - 'desktop-bootstrap/lib/build.mjs'
      - 'desktop-bootstrap/lib/compact-package.mjs'
      - 'server/modules/auth/**'
      - 'server/modules/desktop-auth/**'
      - 'server/piecemaker/index.ts'
      - 'server/modules/websocket/services/websocket-server.service.ts'
      - 'src/piecemaker/remote/**'
      - '.github/workflows/piecemaker-desktop-passwords.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Native verifier and desktop isolation
        shell: bash
        run: node --experimental-vm-modules --test desktop-bootstrap/overlay/electron-piecemaker/auth/*.test.mjs desktop-bootstrap/overlay/electron-piecemaker/main.test.js
      - name: Password reset and session revocation
        shell: bash
        run: npx tsx --env-file=server/piecemaker/tests/upstream-mode.env --tsconfig server/tsconfig.json --test server/modules/desktop-auth/tests/desktop-auth.integration.test.ts
      - name: Real Electron storage and preload
        shell: bash
        run: npx electron desktop-bootstrap/overlay/electron-piecemaker/auth/electron.test.cjs
      - name: Desktop recovery from phone settings
        shell: bash
        run: npx vitest run src/piecemaker/remote/tests/RemoteAccessSettingsTab.test.tsx
