name: "Carte des outils : commit"

on:
  workflow_dispatch:
    inputs:
      modifications:
        description: 'Tableau JSON [{"id","lu","expected"}] envoyé par la Carte des outils'
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: carte-outils-commit
  cancel-in-progress: false

jobs:
  appliquer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[carte-outils]') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Installer TypeScript pour la vérification de syntaxe
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund typescript@5.9.3

      - name: Lire les modifications
        env:
          MODIFICATIONS: ${{ inputs.modifications }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/carte-outils/lire-modifications.mjs > "$RUNNER_TEMP/modifications.json"

      - name: Appliquer les modifications
        id: appliquer
        env:
          NODE_PATH: ${{ runner.temp }}/ts/node_modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="carte-outils/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          node scripts/carte-outils/appliquer.mjs "$RUNNER_TEMP/modifications.json" "chore(carte-outils): modifier des instructions depuis la carte" > "$RUNNER_TEMP/resultat.json"
          git add docs/carte-outils.html
          git diff --cached --quiet || git commit -m "chore(carte-outils): instantané à jour"
          node scripts/carte-outils/resume-commit.mjs "$RUNNER_TEMP/resultat.json" > "$RUNNER_TEMP/pr.md"
          cat "$RUNNER_TEMP/pr.md" >> "$GITHUB_STEP_SUMMARY"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "committed=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).commit.committed" "$RUNNER_TEMP/resultat.json")" >> "$GITHUB_OUTPUT"

      - name: Ouvrir la PR
        id: pr
        if: steps.appliquer.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.appliquer.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "$BRANCH"
          url=$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore(carte-outils): modifier des instructions depuis la carte" \
            --body-file "$RUNNER_TEMP/pr.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Répondre sur le ticket
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$PR_URL" ]; then
            { echo "PR ouverte : $PR_URL"; echo; cat "$RUNNER_TEMP/pr.md"; } > "$RUNNER_TEMP/reponse.md"
          else
            { echo "Aucune modification appliquée. Détail : $RUN_URL"; echo; cat "$RUNNER_TEMP/pr.md" 2>/dev/null || true; } > "$RUNNER_TEMP/reponse.md"
          fi
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reponse.md"
          gh issue close "$ISSUE"

      - name: Signaler un commit vide
        if: steps.appliquer.outputs.committed != 'true'
        run: |
          echo "::error::Aucune modification appliquée : voir le résumé de l'exécution."
          exit 1
