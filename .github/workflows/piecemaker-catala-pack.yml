name: PieceMaker Catala Pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Read compiler version
        id: recipe
        run: node -e 'const fs = require("node:fs"); const recipe = require("./desktop-bootstrap/composants/catala-pack.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `compiler=${recipe.build.compiler}\n`);'

      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: ${{ steps.recipe.outputs.compiler }}
          opam-pin: false
          windows-compiler: mingw
          windows-environment: cygwin

      - name: Install Cygwin Python for Z3
        if: runner.os == 'Windows'
        run: opam install --yes --depext-only conf-python-3

      - name: Test pack contracts
        run: node --test desktop-bootstrap/composants/catala.test.mjs desktop-bootstrap/composants/catala-archive.test.mjs desktop-bootstrap/overlay/electron-piecemaker/catala-pack.test.mjs

      - name: Compile pinned tools
        run: opam exec -- node desktop-bootstrap/composants/catala-archive.mjs opam --platform "$CATALA_PLATFORM" --out "$RUNNER_TEMP/catala"
        env:
          CATALA_PLATFORM: ${{ matrix.platform }}

      - name: Build runtime archive
        run: opam exec -- node desktop-bootstrap/composants/catala-archive.mjs build --platform "$CATALA_PLATFORM" --out "$RUNNER_TEMP/catala"
        env:
          CATALA_PLATFORM: ${{ matrix.platform }}

      - name: Verify archive without the compiler
        run: node desktop-bootstrap/composants/catala-archive.mjs verify --archive "$RUNNER_TEMP/catala/piecemaker-catala-$CATALA_PLATFORM.tar.gz" --work "$RUNNER_TEMP" --output "$RUNNER_TEMP/catala/piecemaker-catala-$CATALA_PLATFORM.verification.json"
        env:
          CATALA_PLATFORM: ${{ matrix.platform }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: piecemaker-catala-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/catala/piecemaker-catala-*.tar.gz
            ${{ runner.temp }}/catala/piecemaker-catala-*.tar.gz.sha256
            ${{ runner.temp }}/catala/piecemaker-catala-*.verification.json
