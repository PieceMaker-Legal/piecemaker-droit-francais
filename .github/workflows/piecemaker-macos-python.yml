name: PieceMaker macOS Desktop and Python

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the macOS Python runtime to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-python:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Test Python component installation
        run: node --test desktop-bootstrap/composants/*.test.mjs

      - name: Build and verify relocated macOS Python
        run: node desktop-bootstrap/composants/build-release.mjs "$RUNNER_TEMP/python-assets"
        env:
          PIECEMAKER_TAG: ${{ inputs.tag }}
          PIECEMAKER_REPO: ${{ github.repository }}

      - name: Attach verified runtime to release
        run: gh release upload "$TAG" "$RUNNER_TEMP"/python-assets/piecemaker-python-darwin-arm64.* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Build precompiled desktop with Electron
        run: |
          export PIECEMAKER_SRC_DIR="$GITHUB_WORKSPACE"
          node desktop-bootstrap/lib/build-release.mjs "$RUNNER_TEMP/desktop-assets/piecemaker-desktop-darwin-arm64.tar.gz"
          cd "$RUNNER_TEMP/desktop-assets"
          shasum -a 256 piecemaker-desktop-darwin-arm64.tar.gz | cut -d' ' -f1 > piecemaker-desktop-darwin-arm64.tar.gz.sha256
        env:
          CI: "true"
          PIECEMAKER_HOME: ${{ runner.temp }}/piecemaker-home
          PIECEMAKER_TAG: ${{ inputs.tag }}
          PIECEMAKER_REPO: ${{ github.repository }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Test precompiled desktop and Electron integration
        run: node --experimental-vm-modules --test desktop-bootstrap/lib/prebuilt-app.test.mjs desktop-bootstrap/overlay/electron-piecemaker/*.test.mjs desktop-bootstrap/overlay/electron-piecemaker/*.test.js

      - name: Attach precompiled desktop to release
        run: gh release upload "$TAG" "$RUNNER_TEMP"/desktop-assets/piecemaker-desktop-darwin-arm64.tar.gz* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
